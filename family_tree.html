const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'');$('search').oninput=()=>{let q=norm($('search').value.trim()),out=$('results');out.replaceChildren();if(!q){out.hidden=true;return}let list=D.people.filter(p=>norm([p.name,...(p.aliases||[])].join(' ')).includes(q)).slice(0,12);if(!list.length)out.append(e('div','No matching person','result'));for(const p of list){let b=e('button',null,'result');b.append(e('strong',p.name),e('small',years(p)+(p.aliases?.length?' · '+p.aliases.join(', '):'')));b.onclick=()=>selectPerson(p.id);out.append(b)}out.hidden=false};$('search').onkeydown=x=>{if(x.key==='Enter')$('results').querySelector('button')?.click();if(x.key==='Escape')$('results').hidden=true};document.addEventListener('pointerdown',x=>{if(!x.target.closest('.search-wrap'))$('results').hidden=true});
$('plus').onclick=()=>zoom(1.35);$('minus').onclick=()=>zoom(1/1.35);$('fit').onclick=()=>{highlight=null;render();fit();$('inspector').classList.remove('open')};$('branch-toggle').onclick=()=>$('rail').classList.toggle('mobile-open');$('photo-close').onclick=()=>$('photo-modal').classList.remove('open');$('photo-modal').onclick=x=>{if(x.target===$('photo-modal'))$('photo-modal').classList.remove('open')};
canvas.addEventListener('wheel',x=>{x.preventDefault();let r=canvas.getBoundingClientRect();zoom(x.deltaY<0?1.15:1/1.15,x.clientX-r.left,x.clientY-r.top)},{passive:false});canvas.addEventListener('pointerdown',x=>{if(x.target.closest('.tile'))return;canvas.setPointerCapture(x.pointerId);pointers.set(x.pointerId,{x:x.clientX,y:x.clientY});if(pointers.size===2){let a=[...pointers.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}canvas.classList.add('grabbing')});canvas.addEventListener('pointermove',x=>{if(!pointers.has(x.pointerId))return;let old=pointers.get(x.pointerId);pointers.set(x.pointerId,{x:x.clientX,y:x.clientY});if(pointers.size===1){tx+=x.clientX-old.x;ty+=x.clientY-old.y;apply()}else if(pointers.size===2){let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch&&dist){let r=canvas.getBoundingClientRect();zoom(dist/lastPinch,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);lastPinch=dist}}});function release(x){pointers.delete(x.pointerId);lastPinch=0;canvas.classList.remove('grabbing')}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
window.addEventListener('keydown',x=>{if(x.key==='Escape'){$('photo-modal').classList.remove('open');$('inspector').classList.remove('open');$('rail').classList.remove('mobile-open')}if(x.key==='+'&&x.target.tagName!=='INPUT')zoom(1.2);if(x.key==='-'&&x.target.tagName!=='INPUT')zoom(1/1.2)});window.addEventListener('resize',()=>drawMap());
render();fit();
